
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almee Kuo — Product Experience Designer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f5;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 720px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      color: #666;
      margin-bottom: 40px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    a {
      display: block;
      padding: 18px 24px;
      background: white;
      color: #222;
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 18px;
      transition: 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Almee Kuo</h1>
    <p>Product Experience Designer</p>

    <div class="links">
      <a href="/resume/">View Resume</a>
      <a href="/portfolio/">View Portfolio</a>
    </div>
  </main>
</body>
</html>
